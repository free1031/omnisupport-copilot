      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-in-prod}
    volumes:
      - ..:/workspace
    networks:
      - omni_net

  # One-shot real data and release bootstrap. Run with: --profile capstone up capstone_bootstrap
  capstone_bootstrap:
    build:
      context: ..
      dockerfile: infra/devbox.Dockerfile
    container_name: omni_capstone_bootstrap
    profiles: ["capstone"]
    working_dir: /workspace
    command: python -m scripts.capstone.bootstrap --root /workspace --stage all
    environment:
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql://${POSTGRES_USER:-omni}:${POSTGRES_PASSWORD:-omnipass}@postgres:5432/${POSTGRES_DB:-omnisupport}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      POSTGRES_USER: ${POSTGRES_USER:-omni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnipass}
      POSTGRES_DB: ${POSTGRES_DB:-omnisupport}
      DBT_TARGET: ${DBT_TARGET:-dev}
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_PORT: 5432
      WEEK05_DATA_RELEASE_ID: ${CAPSTONE_DATA_RELEASE_ID:-data-capstone-v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      CAPSTONE_TICKET_COUNT: ${CAPSTONE_TICKET_COUNT:-240}
      CAPSTONE_AS_OF: ${CAPSTONE_AS_OF:-2026-07-21T00:00:00Z}
      CAPSTONE_RELEASE_ID: ${CAPSTONE_RELEASE_ID:-capstone-v1.0.0}
      CAPSTONE_DATA_RELEASE_ID: ${CAPSTONE_DATA_RELEASE_ID:-data-capstone-v1}
      CAPSTONE_INDEX_RELEASE_ID: ${CAPSTONE_INDEX_RELEASE_ID:-index-capstone-v1}
      CAPSTONE_PROMPT_RELEASE_ID: ${CAPSTONE_PROMPT_RELEASE_ID:-prompt-capstone-v1}
      CAPSTONE_GRAPH_RELEASE_ID: ${CAPSTONE_GRAPH_RELEASE_ID:-graph-capstone-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4318
      OTEL_SERVICE_NAME: capstone_bootstrap
      OTEL_PROJECT_NAME: ${OTEL_PROJECT_NAME:-omnisupport-copilot}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-dev}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
      minio_init:
        condition: service_completed_successfully
      otel_collector:
        condition: service_started
    volumes:
      - ..:/workspace
    networks:
      - omni_net
