# OmniSupport Copilot — Week01 最小可演进基线
# 服务启动顺序: postgres → minio → rag_api / tool_api → dagster → otel_collector → phoenix
# 使用方式: docker compose --env-file infra/env/.env.local up -d

networks:
  omni_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  dagster_data:
  phoenix_data:

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. PostgreSQL — 结构化存储 + pgvector 向量检索
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnipass}
      POSTGRES_DB: ${POSTGRES_DB:-omnisupport}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - omni_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omni} -d ${POSTGRES_DB:-omnisupport}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"

  # Explicit additive migration gate for existing and fresh PostgreSQL volumes.
  db_migrate:
    image: pgvector/pgvector:pg16
    container_name: omni_db_migrate
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-omni}
      PGPASSWORD: ${POSTGRES_PASSWORD:-omnipass}
      PGDATABASE: ${POSTGRES_DB:-omnisupport}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - omni_net
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS app_schema_migration (version TEXT PRIMARY KEY, checksum TEXT NOT NULL, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW())"
        for file in /migrations/*.sql; do
          version=$$(basename "$$file")
          [ "$$version" = "001_init.sql" ] && continue
          checksum=$$(sha256sum "$$file" | awk '{print $$1}')
          stored=$$(psql -v ON_ERROR_STOP=1 -Atc "SELECT checksum FROM app_schema_migration WHERE version = '$$version'")
          if [ -n "$$stored" ] && [ "$$stored" != "$$checksum" ]; then
            echo "Migration checksum mismatch: $$version" >&2
            exit 1
          fi
          if [ -z "$$stored" ]; then
            echo "Applying $$version"
            psql -v ON_ERROR_STOP=1 --single-transaction \
              -f "$$file" \
              -c "INSERT INTO app_schema_migration(version, checksum) VALUES ('$$version', '$$checksum')"
          fi
        done
        echo "Database migrations are current"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. MinIO — 对象存储 (S3 兼容), raw zone 与中间制品落盘
  # ─────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: omni_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    networks:
      - omni_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. MinIO Init — 自动创建 bucket 分区
  # ─────────────────────────────────────────────────────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: omni_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - omni_net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/omni-raw-documents;
        mc mb --ignore-existing local/omni-raw-audio;
        mc mb --ignore-existing local/omni-raw-video;
        mc mb --ignore-existing local/omni-raw-tickets;
        mc mb --ignore-existing local/omni-parsed;
        mc mb --ignore-existing local/omni-indexes;
        mc mb --ignore-existing local/omni-evals;
        mc mb --ignore-existing local/omni-releases;
        mc mb --ignore-existing local/omni-lakehouse;
        echo 'MinIO buckets initialized';
      "

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. RAG API — FastAPI 检索增强生成服务
  # ─────────────────────────────────────────────────────────────────────────────
  rag_api:
    build:
      context: ..
      dockerfile: services/rag_api/Dockerfile
    container_name: omni_rag_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-omni}:${POSTGRES_PASSWORD:-omnipass}@postgres:5432/${POSTGRES_DB:-omnisupport}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-768}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-8192}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-true}
      QUERY_REWRITE_STRATEGY: ${QUERY_REWRITE_STRATEGY:-auto}
      QUERY_REWRITE_PROVIDER: ${QUERY_REWRITE_PROVIDER:-}
      QUERY_REWRITE_MODEL: ${QUERY_REWRITE_MODEL:-}
      QUERY_REWRITE_BASE_URL: ${QUERY_REWRITE_BASE_URL:-}
      QUERY_REWRITE_PROMPT_RELEASE_ID: ${QUERY_REWRITE_PROMPT_RELEASE_ID:-query-rewrite-v1}
      QUERY_REWRITE_TIMEOUT_SECONDS: ${QUERY_REWRITE_TIMEOUT_SECONDS:-6}
      QUERY_REWRITE_MAX_ATTEMPTS: ${QUERY_REWRITE_MAX_ATTEMPTS:-2}
      QUERY_REWRITE_MAX_OUTPUT_CHARS: ${QUERY_REWRITE_MAX_OUTPUT_CHARS:-1024}
      QUERY_REWRITE_MAX_TOKENS: ${QUERY_REWRITE_MAX_TOKENS:-256}
      QUERY_REWRITE_CONTEXT_TOKENS: ${QUERY_REWRITE_CONTEXT_TOKENS:-2048}
      QUERY_REWRITE_TEMPERATURE: ${QUERY_REWRITE_TEMPERATURE:-0}
      QUERY_REWRITE_HYDE_ENABLED: ${QUERY_REWRITE_HYDE_ENABLED:-false}
      QUERY_REWRITE_REDACT_PII: ${QUERY_REWRITE_REDACT_PII:-true}
      QUERY_REWRITE_CACHE_TTL_SECONDS: ${QUERY_REWRITE_CACHE_TTL_SECONDS:-300}
      QUERY_REWRITE_CACHE_MAX_ENTRIES: ${QUERY_REWRITE_CACHE_MAX_ENTRIES:-2048}
      QUERY_REWRITE_CIRCUIT_FAILURE_THRESHOLD: ${QUERY_REWRITE_CIRCUIT_FAILURE_THRESHOLD:-5}
      QUERY_REWRITE_CIRCUIT_RECOVERY_SECONDS: ${QUERY_REWRITE_CIRCUIT_RECOVERY_SECONDS:-30}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-in-prod}
      REQUIRE_INTERNAL_AUTH: ${REQUIRE_INTERNAL_AUTH:-true}
      CORS_ORIGINS: '["http://localhost:8010","http://127.0.0.1:8010"]'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4318
      OTEL_SERVICE_NAME: rag_api
      OTEL_PROJECT_NAME: ${OTEL_PROJECT_NAME:-omnisupport-copilot}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-dev}
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1.0}
      OTEL_CAPTURE_CONTENT: ${OTEL_CAPTURE_CONTENT:-false}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      RELEASE_ID: ${CAPSTONE_RELEASE_ID:-capstone-v1.0.0}
      DATA_RELEASE_ID: ${CAPSTONE_DATA_RELEASE_ID:-data-capstone-v1}
      INDEX_RELEASE_ID: ${CAPSTONE_INDEX_RELEASE_ID:-index-capstone-v1}
      PROMPT_RELEASE_ID: ${CAPSTONE_PROMPT_RELEASE_ID:-prompt-capstone-v1}
      GRAPH_RELEASE_ID: ${CAPSTONE_GRAPH_RELEASE_ID:-graph-capstone-v1}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.015}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic}
      PYTHONPATH: /app:/workspace
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      otel_collector:
        condition: service_started
    networks:
      - omni_net
    volumes:
      - ../services/rag_api:/app
      - ../services/graph:/workspace/services/graph:ro
      - ../pipelines:/workspace/pipelines:ro
      - ../observability:/app/observability:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Tool API — 工单工具 + HITL + 审计日志服务
  # ─────────────────────────────────────────────────────────────────────────────
  tool_api:
    build:
      context: ..
      dockerfile: services/tool_api/Dockerfile
    container_name: omni_tool_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-omni}:${POSTGRES_PASSWORD:-omnipass}@postgres:5432/${POSTGRES_DB:-omnisupport}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4318
      OTEL_SERVICE_NAME: tool_api
      OTEL_PROJECT_NAME: ${OTEL_PROJECT_NAME:-omnisupport-copilot}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-dev}
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1.0}
      OTEL_CAPTURE_CONTENT: ${OTEL_CAPTURE_CONTENT:-false}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      RELEASE_ID: ${CAPSTONE_RELEASE_ID:-capstone-v1.0.0}
      DATA_RELEASE_ID: ${CAPSTONE_DATA_RELEASE_ID:-data-capstone-v1}
      METRIC_REGISTRY_PATH: /workspace/analytics/metric_registry_v1.yml
      SKILL_REGISTRY_PATH: /workspace/skills
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-in-prod}
      REQUIRE_INTERNAL_AUTH: ${REQUIRE_INTERNAL_AUTH:-true}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
      otel_collector:
        condition: service_started
    networks:
      - omni_net
    volumes:
      - ../services/tool_api:/app
      - ../observability:/app/observability:ro
      - ../agent:/app/agent:ro
      - ../tools:/app/tools:ro
      - ../analytics:/workspace/analytics:ro
      - ../contracts:/workspace/contracts:ro
      - ../skills:/workspace/skills:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Product API — authentication, case workspace, conversations and control plane
  # ─────────────────────────────────────────────────────────────────────────────
  copilot_api:
    build:
      context: ..
      dockerfile: services/copilot_api/Dockerfile
    container_name: omni_copilot_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-omni}:${POSTGRES_PASSWORD:-omnipass}@postgres:5432/${POSTGRES_DB:-omnisupport}
      RAG_API_URL: http://rag_api:8000
      TOOL_API_URL: http://tool_api:8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-in-prod}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-dev-auth-key-change-in-prod}
      DEMO_AGENT_EMAIL: ${DEMO_AGENT_EMAIL:-agent@northstar.demo}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-Agent@2026}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@northstar.demo}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@2026}
      ENABLE_DEMO_USERS: ${ENABLE_DEMO_USERS:-true}
      RELEASE_ID: ${CAPSTONE_RELEASE_ID:-capstone-v1.0.0}
      RELEASE_ENVIRONMENT: ${CAPSTONE_RELEASE_ENVIRONMENT:-dev}
      DATA_RELEASE_ID: ${CAPSTONE_DATA_RELEASE_ID:-data-capstone-v1}
      PROMPT_RELEASE_ID: ${CAPSTONE_PROMPT_RELEASE_ID:-prompt-capstone-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel_collector:4318
      OTEL_SERVICE_NAME: copilot_api
      OTEL_PROJECT_NAME: ${OTEL_PROJECT_NAME:-omnisupport-copilot}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-dev}
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1.0}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
      rag_api:
        condition: service_healthy
      tool_api:
        condition: service_healthy
      otel_collector:
        condition: service_started
    networks:
      - omni_net
    volumes:
      - ../services/copilot_api:/app
      - ../observability:/app/observability:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/live"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. Product Console — real support workspace served behind same-origin API proxy
  # ─────────────────────────────────────────────────────────────────────────────
  copilot_console:
    build:
      context: ..
      dockerfile: apps/copilot_console/Dockerfile
    container_name: omni_copilot_console
    restart: unless-stopped
    ports:
      - "8010:80"
    depends_on:
      copilot_api:
        condition: service_healthy
    networks:
      - omni_net

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. Dagster — 资产化编排 (ingestion / parse / lakehouse / indexing)
  # ─────────────────────────────────────────────────────────────────────────────
  dagster:
    build:
      context: ..
      dockerfile: infra/dagster.Dockerfile
    image: omnisupport-dagster:local
    container_name: omni_dagster
    restart: unless-stopped
    command: dagster dev -h 0.0.0.0 -p 3000 -m pipelines.definitions
    working_dir: /opt/dagster/app
    environment:
      PYTHONPATH: /opt/dagster/app:/workspace
      DATABASE_URL: postgresql://${POSTGRES_USER:-omni}:${POSTGRES_PASSWORD:-omnipass}@postgres:5432/${POSTGRES_DB:-omnisupport}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DAGSTER_HOME: /opt/dagster/dagster_home
      SEED_MANIFEST_PATH: /manifests
      ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:-omni}
      ICEBERG_CATALOG_TYPE: ${ICEBERG_CATALOG_TYPE:-sql}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-postgresql+psycopg2://omni:omnipass@postgres:5432/omnisupport}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://omni-lakehouse/warehouse}
      ICEBERG_NAMESPACE_BRONZE: ${ICEBERG_NAMESPACE_BRONZE:-bronze}
      ICEBERG_NAMESPACE_SILVER: ${ICEBERG_NAMESPACE_SILVER:-silver}
      ICEBERG_FILE_IO: ${ICEBERG_FILE_IO:-pyiceberg.io.pyarrow.PyArrowFileIO}
      ICEBERG_S3_ENDPOINT: ${ICEBERG_S3_ENDPOINT:-http://minio:9000}
      ICEBERG_S3_ACCESS_KEY_ID: ${ICEBERG_S3_ACCESS_KEY_ID:-minioadmin}
      ICEBERG_S3_SECRET_ACCESS_KEY: ${ICEBERG_S3_SECRET_ACCESS_KEY:-minioadmin}
      ICEBERG_S3_REGION: ${ICEBERG_S3_REGION:-us-east-1}
      ICEBERG_S3_PATH_STYLE_ACCESS: ${ICEBERG_S3_PATH_STYLE_ACCESS:-true}
      WEEK04_DATA_RELEASE_ID: ${WEEK04_DATA_RELEASE_ID:-week04-dev-local}
      WEEK04_INGEST_BATCH_ID: ${WEEK04_INGEST_BATCH_ID:-week04-smoke}
      WEEK04_REPORT_DIR: ${WEEK04_REPORT_DIR:-reports/week04}
      DBT_TARGET: ${DBT_TARGET:-dev}
      DBT_POSTGRES_HOST: ${DBT_POSTGRES_HOST:-postgres}
      DBT_POSTGRES_PORT: ${DBT_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-omni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnipass}
      POSTGRES_DB: ${POSTGRES_DB:-omnisupport}
      WEEK05_DATA_RELEASE_ID: ${WEEK05_DATA_RELEASE_ID:-week05-dev-local}
      WEEK05_REPORT_DIR: ${WEEK05_REPORT_DIR:-reports/week05}
      METRIC_REGISTRY_PATH: ${METRIC_REGISTRY_PATH:-/workspace/analytics/metric_registry_v1.yml}
      WEEK06_PROJECT_ROOT: ${WEEK06_PROJECT_ROOT:-/workspace}
      WEEK06_DATA_RELEASE_ID: ${WEEK06_DATA_RELEASE_ID:-week06-dev-local}
      WEEK06_REPORT_DIR: ${WEEK06_REPORT_DIR:-reports/week06}
      WEEK06_PARTITION_START_DATE: ${WEEK06_PARTITION_START_DATE:-2026-03-01}
      WEEK06_DEFAULT_PARTITION: ${WEEK06_DEFAULT_PARTITION:-2026-04-17}
      WEEK06_TICKET_SEED_PATH: ${WEEK06_TICKET_SEED_PATH:-data/canonization/tickets/tickets-seed-001.jsonl}
      WEEK06_INGEST_DRY_RUN: ${WEEK06_INGEST_DRY_RUN:-true}
      WEEK06_INGEST_LIMIT: ${WEEK06_INGEST_LIMIT:-}
      WEEK06_OPERATOR: ${WEEK06_OPERATOR:-student-devbox}
      WEEK06_WEEK04_REPORT_PATH: ${WEEK06_WEEK04_REPORT_PATH:-reports/week04/materialization_report.json}
      WEEK06_WEEK05_RUN_RESULTS_PATH: ${WEEK06_WEEK05_RUN_RESULTS_PATH:-analytics/target/run_results.json}
      WEEK07_MANIFEST_PATH: ${WEEK07_MANIFEST_PATH:-data/seed_manifests/manifest_workspace_helpcenter_v1.json}
      WEEK07_DATA_RELEASE_ID: ${WEEK07_DATA_RELEASE_ID:-week07-dev-local}
      WEEK07_ARTIFACTS_DIR: ${WEEK07_ARTIFACTS_DIR:-artifacts/week07}
      WEEK07_REPORT_DIR: ${WEEK07_REPORT_DIR:-reports/week07}
      WEEK07_PARSER: ${WEEK07_PARSER:-auto}
      WEEK07_CHUNK_STRATEGY_VERSION: ${WEEK07_CHUNK_STRATEGY_VERSION:-section_aware_v1}
      WEEK07_PARSE_DRY_RUN: ${WEEK07_PARSE_DRY_RUN:-true}
      WEEK13_GRAPH_RELEASE_ID: ${WEEK13_GRAPH_RELEASE_ID:-graph-week13-dev-v1}
      WEEK13_GRAPH_SOURCE_PATH: ${WEEK13_GRAPH_SOURCE_PATH:-/workspace/data/week13/graph_source_chunks_v1.jsonl}
      WEEK15_PROJECT_ROOT: /workspace
      CAPSTONE_TICKET_COUNT: ${CAPSTONE_TICKET_COUNT:-240}
      CAPSTONE_AS_OF: ${CAPSTONE_AS_OF:-2026-07-21T00:00:00Z}
      CAPSTONE_RELEASE_ID: ${CAPSTONE_RELEASE_ID:-capstone-v1.0.0}
      CAPSTONE_DATA_RELEASE_ID: ${CAPSTONE_DATA_RELEASE_ID:-data-capstone-v1}
      CAPSTONE_INDEX_RELEASE_ID: ${CAPSTONE_INDEX_RELEASE_ID:-index-capstone-v1}
      CAPSTONE_PROMPT_RELEASE_ID: ${CAPSTONE_PROMPT_RELEASE_ID:-prompt-capstone-v1}
      CAPSTONE_GRAPH_RELEASE_ID: ${CAPSTONE_GRAPH_RELEASE_ID:-graph-capstone-v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - omni_net
    volumes:
      - ../pipelines:/opt/dagster/app/pipelines
      - ../data/seed_manifests:/manifests:ro
      - ../contracts:/workspace/contracts:ro
      - ../docs:/workspace/docs:ro
      - ../runbooks:/workspace/runbooks:ro
      - ../analytics:/workspace/analytics
      - ../data:/workspace/data
      - ../reports:/workspace/reports
      - ../artifacts:/workspace/artifacts
      - ../scripts:/workspace/scripts:ro
      - ../infra/migrations:/workspace/infra/migrations:ro
      - dagster_data:/opt/dagster/dagster_home

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. OpenTelemetry Collector — 统一 trace / metric / log 采集
  # ─────────────────────────────────────────────────────────────────────────────
  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: omni_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"   # gRPC OTLP
      - "4318:4318"   # HTTP OTLP
      - "8889:8889"   # Prometheus metrics
    volumes:
      - ../observability/otel/config.yaml:/etc/otel/config.yaml:ro
    networks:
      - omni_net
    depends_on:
      phoenix:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────────
  # 10. Phoenix (Arize) — AI 请求可观测 + bad case replay
  # ─────────────────────────────────────────────────────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:version-14.2.1
    container_name: omni_phoenix
    restart: unless-stopped
    environment:
      PHOENIX_PORT: 6006
      PHOENIX_GRPC_PORT: 4317
      PHOENIX_WORKING_DIR: /data
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/data
    networks:
      - omni_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # 11. Ticket Simulator — 工单模拟器 / seed loader
  # ─────────────────────────────────────────────────────────────────────────────
  ticket_simulator:
    build:
      context: ../data/synthetic_generators
      dockerfile: Dockerfile
    container_name: omni_ticket_simulator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-omni}:${POSTGRES_PASSWORD:-omnipass}@postgres:5432/${POSTGRES_DB:-omnisupport}
      SEED_MANIFEST_PATH: /manifests
      TICKET_COUNT: ${SEED_TICKET_COUNT:-500}
    depends_on:
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
    networks:
      - omni_net
    volumes:
      - ../data/seed_manifests:/manifests:ro
      - ../data/canonization:/canonization:ro

  # ─────────────────────────────────────────────────────────────────────────────
  # 12. Devbox — 无本地 Python 依赖的本地验证容器
  # ─────────────────────────────────────────────────────────────────────────────
  devbox:
    build:
      context: ..
      dockerfile: infra/devbox.Dockerfile
    container_name: omni_devbox
    profiles: ["tools"]
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql://${POSTGRES_USER:-omni}:${POSTGRES_PASSWORD:-omnipass}@postgres:5432/${POSTGRES_DB:-omnisupport}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:-omni}
      ICEBERG_CATALOG_TYPE: ${ICEBERG_CATALOG_TYPE:-sql}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-postgresql+psycopg2://omni:omnipass@postgres:5432/omnisupport}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://omni-lakehouse/warehouse}
      ICEBERG_NAMESPACE_BRONZE: ${ICEBERG_NAMESPACE_BRONZE:-bronze}
      ICEBERG_NAMESPACE_SILVER: ${ICEBERG_NAMESPACE_SILVER:-silver}
      ICEBERG_FILE_IO: ${ICEBERG_FILE_IO:-pyiceberg.io.pyarrow.PyArrowFileIO}
      ICEBERG_S3_ENDPOINT: ${ICEBERG_S3_ENDPOINT:-http://minio:9000}
      ICEBERG_S3_ACCESS_KEY_ID: ${ICEBERG_S3_ACCESS_KEY_ID:-minioadmin}
