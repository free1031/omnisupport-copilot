components:
  data:
    release_id: data-week14-dev-v1
    lakefs_repository: omnisupport-data
    lakefs_ref: refs/tags/data-week14-dev-v1
    iceberg_snapshot_ids:
      bronze.ticket_event: "week04-baseline"
      silver.ticket_current: "week04-baseline"
    source_paths:
      - data/seed_manifests/manifest_tickets_synthetic_v1.json
      - data/seed_manifests/manifest_workspace_helpcenter_v1.json
  index:
    release_id: index-week08-dev
    data_release_id: data-week14-dev-v1
    embedding_model: deterministic-hash-v1
    source_paths:
      - tests/contract/fixtures/week08/index_manifest.valid.json
  prompt:
    release_id: prompt-week08-v1
    template_versions:
      answer: answer_v1
      no_answer: no_answer_v1
      graph_global: graph_global_v1
    source_paths:
      - services/rag_api/app/prompts/prompt_manifest.yml
      - services/rag_api/app/prompts/graph_prompt_manifest.yml
  model:
    release_id: model-local-deterministic-v1
    provider: local
    model_id: deterministic-course-baseline
    snapshot: deterministic-course-baseline@sha256-pinned
    system_card: docs/blueprints/week14/model-system-card.md
    source_paths:
      - docs/blueprints/week14/model-system-card.md
  skills:
    release_id: skills-week09-v1
    packs:
      - release-check@0.1.0
      - rag-contract-check@0.1.0
    source_paths:
      - skills/release-check/SKILL.md
      - skills/rag-contract-check/SKILL.md
  graph:
    release_id: graph-week13-dev-v1
    schema_version: graph_schema_v1
    source_paths:
      - pipelines/graph/schema.yaml
quality:
  eval:
    run_id: eval-week11-governance-baseline
    gate_status: pass
    report_path: evals/baselines/week11_baseline_metrics.json
    source_paths:
      - evals/baselines/week11_baseline_metrics.json
business_slo:
  policy_id: week12-slo-v1
  status: pass
  source_paths:
    - observability/slo/week12_slo.yaml
rollout:
  stages:
    - traffic_percent: 5
      min_samples: 20
      min_observation_minutes: 10
      gates:
        - {metric: answer_correctness, operator: ">=", threshold: 0.75}
        - {metric: latency_p99_ms, operator: "<=", threshold: 2500}
      baseline_guards:
        - {metric: answer_correctness, operator: ">=", threshold: -0.02}
    - traffic_percent: 25
      min_samples: 100
      min_observation_minutes: 30
      gates:
        - {metric: answer_correctness, operator: ">=", threshold: 0.78}
        - {metric: latency_p99_ms, operator: "<=", threshold: 2200}
      baseline_guards:
        - {metric: answer_correctness, operator: ">=", threshold: -0.01}
    - traffic_percent: 50
      min_samples: 300
      min_observation_minutes: 60
      gates:
        - {metric: answer_correctness, operator: ">=", threshold: 0.80}
        - {metric: latency_p99_ms, operator: "<=", threshold: 2000}
      baseline_guards:
        - {metric: answer_correctness, operator: ">=", threshold: 0.0}
    - traffic_percent: 100
      min_samples: 1000
      min_observation_minutes: 120
      gates:
        - {metric: answer_correctness, operator: ">=", threshold: 0.82}
        - {metric: latency_p99_ms, operator: "<=", threshold: 1800}
      baseline_guards:
        - {metric: answer_correctness, operator: ">=", threshold: 0.0}
  red_lines:
    - {metric: pii_leak_rate, operator: ">", threshold: 0}
    - {metric: safety_pass_rate, operator: "<", threshold: 1.0}
governance:
  change_ticket: CHG-WEEK14-LOCAL
  data_classification: internal
  required_approvals:
    - release_owner
    - service_owner
