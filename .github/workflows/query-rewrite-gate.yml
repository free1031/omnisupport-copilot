name: Query Rewrite Production Gate

on:
  pull_request:
    paths:
      - "pipelines/query/**"
      - "services/rag_api/app/query_rewrite.py"
      - "services/rag_api/app/llm.py"
      - "services/rag_api/app/config.py"
      - "services/rag_api/app/prompts/query_rewrite_v1.md"
      - "services/rag_api/app/retrieval.py"
      - "services/rag_api/app/routers/**"
      - "contracts/service/query_rewrite.schema.json"
      - "contracts/evals/query_rewrite_eval_report.schema.json"
      - "evals/query_rewrite/**"
      - "evals/fixtures/query_rewrite_cases_v1.jsonl"
      - "tests/**query_rewrite**"
      - ".github/workflows/query-rewrite-gate.yml"
  push:
    branches: [main]
    paths:
      - "pipelines/query/**"
      - "services/rag_api/app/query_rewrite.py"
      - "services/rag_api/app/llm.py"
      - "services/rag_api/app/config.py"
      - "services/rag_api/app/prompts/query_rewrite_v1.md"
      - "evals/query_rewrite/**"
      - "tests/**query_rewrite**"
      - ".github/workflows/query-rewrite-gate.yml"

permissions:
  contents: read

jobs:
  safety-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded test dependencies
        run: >-
          python -m pip install
          "pytest>=8.2" "jsonschema>=4.22" "PyYAML>=6,<7"
          "pydantic>=2.7,<3" "pydantic-settings>=2.3,<3"
          "opentelemetry-api>=1.24,<2" "asyncpg>=0.29,<1" "fastapi>=0.111,<1"
          "ruff>=0.4"
      - name: Lint query rewrite runtime
        run: >-
          ruff check
          pipelines/query
          services/rag_api/app/query_rewrite.py
          services/rag_api/app/llm.py
          services/rag_api/app/config.py
          services/rag_api/app/retrieval.py
          services/rag_api/app/routers/rag.py
          tests/integration/test_query_rewrite_production.py
          tests/integration/test_query_rewrite_eval.py
          tests/integration/test_query_rewrite_rag_integration.py
      - name: Run contracts and resilience tests
        env:
          PYTHONPATH: services/rag_api:.
        run: >-
          pytest -q
          tests/integration/test_query_rewrite_production.py
          tests/integration/test_query_rewrite_eval.py
          tests/integration/test_query_rewrite_rag_integration.py
          tests/integration/test_week8_hybrid_retrieval.py
          tests/integration/test_week8_rag_audit.py
          tests/contract/test_query_rewrite_operations.py
          tests/contract/test_week8_rag_contracts.py
      - name: Run deterministic release gate
        env:
          PYTHONPATH: services/rag_api:.
        run: >-
          python -m evals.query_rewrite.run_eval
          --strategy deterministic
          --output reports/query_rewrite/ci_eval_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-rewrite-eval-report
          path: reports/query_rewrite/ci_eval_report.json
          if-no-files-found: error
